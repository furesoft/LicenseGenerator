name: Deploy

on:
  push:
    branches:
      - release

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install .NET tools
        run: |
          dotnet tool install --global GitVersion.Tool
          dotnet tool install --global vpk
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Calculate Version
        id: version
        run: |
          version=$(dotnet-gitversion /output json | jq -r '.MajorMinorPatch')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "GITVERSION_MAJORMINORPATCH=$version" >> "$GITHUB_ENV"

      - name: Build
        run: dotnet build src/LicenseGenerator/LicenseGenerator.csproj --configuration Release

      - name: Publish Windows (win-x64)
        run: dotnet publish src/LicenseGenerator/LicenseGenerator.csproj --configuration Release --runtime win-x64 --no-self-contained --output ./publish-win

      - name: Download Old Windows Release
        run: |
          vpk download github --channel win --repoUrl ${{ github.server_url }}/${{ github.repository }} --token ${{ secrets.GITHUB_TOKEN }} -o ./release

      - name: Velopack Pack Windows
        run: |
          vpk pack --outputDir ./release --channel win --packVersion ${{ steps.version.outputs.version }} -u Furesoft_LicenseGenerator --packTitle 'License Generator' -p ./publish-win --mainExe ./LicenseGenerator.exe

      - name: Velopack Upload Windows
        run: |
          vpk upload github --outputDir ./release --channel win --repoUrl ${{ github.server_url }}/${{ github.repository }} --token ${{ secrets.GITHUB_TOKEN }} --releaseName '${{ steps.version.outputs.version }}' --tag v${{ steps.version.outputs.version }} --merge
